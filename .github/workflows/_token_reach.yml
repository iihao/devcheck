name: _token_reach
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          T: ${{ secrets.METRICS_TOKEN }}
        run: |
          for r in iihao/devcheck iihao/honglou-atlas iihao/song-dynasty iihao/pi-agent-vscode; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $T" \
              -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$r/traffic/views")
            echo "$r → $code"
          done
