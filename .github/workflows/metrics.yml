name: metrics

# GitHub 的 traffic API 只保留最近 14 天，不每天采样就等于永久丢数据。
on:
  schedule:
    - cron: "17 1 * * *"   # UTC 01:17 = 北京时间 09:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sample traffic / stars / downloads
        env:
          # traffic 端点需要 push 权限；contents: write 足够。
          # 如果这里 403，改用带 repo scope 的 PAT：secrets.METRICS_TOKEN
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/track_metrics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(metrics): daily sample $(date -u +%Y-%m-%d)"
          git push
