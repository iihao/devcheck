 <circle cx="60" cy="16" r="6" fill="#28c840"/>
 <text fill="#8b949e" font-size="12" x="470" y="21" text-anchor="middle">devcheck — zsh</text>

 <text x="24" y="60"><tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">devcheck why 5000</tspan></text>
 <text fill="#c9d1d9" x="24" y="88">Port 5000: 1 process(es) listening</text>

 <text x="24" y="116">
 <tspan fill="#7ee787"> ● </tspan><tspan fill="#79c0ff">ControlCenter</tspan><tspan fill="#c9d1d9"> PID 804 </tspan><tspan fill="#8b949e">[app/mine]</tspan><tspan fill="#7ee787"> reachable</tspan>
 </text>
 <text fill="#8b949e" x="24" y="138"> binary: /System/Library/CoreServices/ControlCenter.app/Contents/MacOS/ControlCenter</text>

 <text x="24" y="168">
 <tspan fill="#8b949e"> note: </tspan><tspan fill="#c9d1d9">Port 5000 is macOS AirPlay Receiver, served by ControlCenter.</tspan>
 </text>

 <text x="24" y="196">
 <tspan fill="#ffa657"> fix: </tspan><tspan fill="#c9d1d9">Turn it off in System Settings → General → AirDrop &amp; Handoff → AirPlay Receiver,</tspan>
 </text>
 <text fill="#c9d1d9" x="24" y="216"> or move your service to 5001/5173.</text>
 <text x="24" y="238">
 <tspan fill="#ffa657"> fix: </tspan><tspan fill="#c9d1d9">These are system/app processes — the cheapest fix is a different port (e.g. 5001).</tspan>
 </text>

 <text x="24" y="272">
 <tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">devcheck ports</tspan><tspan fill="#8b949e"> # grouped by project, 25 app/system ports filtered out</tspan>
 </text>

