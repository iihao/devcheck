<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="13">
 <defs>
 </defs>

 <!-- frame 1: devcheck why 5000 -->
 <rect fill="#0d1117" x="0" y="0" width="940" height="322" rx="10"/>
 <rect fill="none" stroke="#30363d" stroke-width="1" x="0.5" y="0.5" width="939" height="321" rx="10"/>
 <path fill="#161b22" d="M0 10a10 10 0 0 1 10-10h920a10 10 0 0 1 10 10v22H0z"/>
 <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
 <circle cx="40" cy="16" r="6" fill="#febc2e"/>
 <circle cx="60" cy="16" r="6" fill="#28c840"/>
 <text fill="#8b949e" font-size="12" x="470" y="21" text-anchor="middle">devcheck — zsh</text>

 <text x="24" y="60"><tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">devcheck why 5000</tspan></text>
 <text fill="#c9d1d9" x="24" y="88">端口 5000：1 个进程占用</text>

 <text x="24" y="116">
 <tspan fill="#7ee787"> ● </tspan><tspan fill="#79c0ff">ControlCenter</tspan><tspan fill="#c9d1d9"> PID 804 </tspan><tspan fill="#8b949e">[应用/我的]</tspan><tspan fill="#7ee787"> 可达</tspan>
 </text>
 <text fill="#8b949e" x="24" y="138"> binary: /System/Library/CoreServices/ControlCenter.app/Contents/MacOS/ControlCenter</text>

 <text x="24" y="168">
 <tspan fill="#8b949e"> note: </tspan><tspan fill="#c9d1d9">5000 是 macOS「隔空播放接收器（AirPlay Receiver）」的默认端口，由 ControlCenter 常驻监听。</tspan>
 </text>

 <text x="24" y="196">
 <tspan fill="#ffa657"> fix: </tspan><tspan fill="#c9d1d9">系统设置 → 通用 → 隔空投送与接力 → 关闭「隔空播放接收器」，</tspan>
 </text>
 <text fill="#c9d1d9" x="24" y="216"> 或把你的服务换到 5001/5173。</text>
 <text x="24" y="238">
 <tspan fill="#ffa657"> fix: </tspan><tspan fill="#c9d1d9">这些是系统/应用进程，最省事的做法是换一个端口（例如 5001）。</tspan>
 </text>

 <text x="24" y="272">
 <tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">devcheck ports</tspan><tspan fill="#8b949e"> # 按项目分组，自动滤掉 25 个应用/系统端口</tspan>
 </text>

 <!-- frame 2: port map -->
 <rect fill="#0d1117" x="0" y="336" width="940" height="224" rx="10"/>
 <rect fill="none" stroke="#30363d" stroke-width="1" x="0.5" y="336.5" width="939" height="223" rx="10"/>
 <path fill="#161b22" d="M0 346a10 10 0 0 1 10-10h920a10 10 0 0 1 10 10v22H0z"/>
 <circle cx="20" cy="352" r="6" fill="#ff5f57"/>
 <circle cx="40" cy="352" r="6" fill="#febc2e"/>
 <circle cx="60" cy="352" r="6" fill="#28c840"/>
 <text fill="#8b949e" font-size="12" x="470" y="357" text-anchor="middle">devcheck — port map</text>

 <text fill="#8b949e" x="24" y="392">端口 协议 状态 PID CPU 来源 项目 命令</text>
 <text fill="#c9d1d9" x="24" y="414">5173 TCP ● 46595 0.0% </text><text fill="#7ee787" x="376" y="414">项目</text><text fill="#c9d1d9" x="440" y="414"> cloud-admin(node) node</text>
 <text fill="#c9d1d9" x="24" y="436">5432 TCP ● 1638 0.0% </text><text fill="#79c0ff" x="376" y="436">brew</text><text fill="#c9d1d9" x="440" y="436"> - postgres</text>
 <text fill="#c9d1d9" x="24" y="458">6379 TCP ● 1634 0.0% </text><text fill="#79c0ff" x="376" y="458">brew</text><text fill="#c9d1d9" x="440" y="458"> - redis-server</text>
 <text fill="#c9d1d9" x="24" y="480">8000 TCP ● 46594 0.0% </text><text fill="#7ee787" x="376" y="480">项目</text><text fill="#c9d1d9" x="440" y="480"> data-api(python) Python</text>

 <text fill="#8b949e" x="24" y="522">菜单栏：按项目分组的端口列表 · 悬停可打开 / 复制 / 定位 / 结束进程</text>
</svg>