name: metrics

# GitHub 的 traffic API 只保留最近 14 天，不每天采样就等于永久丢数据。
on:
  schedule:
    - cron: "17 1 * * *"   # UTC 01:17 = 北京时间 09:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify token can read traffic API
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # traffic 端点要求 push 权限。这里显式检查，避免每周期的 403 被当成"0 流量"。
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/views")
          echo "traffic/views → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::traffic API 返回 $code，采样会写入 0。请配置带 repo 权限的 METRICS_TOKEN。"
          fi

      - name: Sample traffic / stars / downloads
        env:
          # traffic 端点需要 push 权限；contents: write 足够。
          # 如果这里 403，改用带 repo scope 的 PAT：secrets.METRICS_TOKEN
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/track_metrics.py

      # 同一个 PAT 能给 iihao 下所有仓库采样，所以这里一次性把 metrics/repos.txt
      # 里的仓库都抓一遍，徽章文件统一生成在本仓库，各项目 README 引用它们。
      - name: Sample other repos (metrics/repos.txt)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/sample_all_repos.py

      # 账号级数字（总 star / 访客 / 浏览）给个人主页 iihao/iihao 的 README 用，
      # 口径见 scripts/profile_stats.py 的 docstring。
      - name: Aggregate profile stats (iihao/iihao)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_stats.py

      # 个人主页的「数据」卡片：自己画 SVG，不依赖 github-readme-stats。
      - name: Draw profile cards (iihao/iihao)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_card.py

      # 卡片同步到个人主页仓库：README 里用相对路径引用，图由 github.com 直接提供。
      # 引 raw.githubusercontent.com 的话在部分网络下不可达，README 的图会裂开。
      - name: Publish cards to iihao/iihao
        continue-on-error: true
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::warning::没有 METRICS_TOKEN，跳过卡片同步"
            exit 0
          fi
          work=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:$METRICS_TOKEN@github.com/iihao/iihao.git" "$work/profile"
          mkdir -p "$work/profile/metrics"
          cp metrics/badges/iihao-*.svg "$work/profile/metrics/"
          cd "$work/profile"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "卡片没有变化"
            exit 0
          fi
          git commit -m "chore(cards): 同步数据卡片 $(date -u +%Y-%m-%d)"
          git push

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(metrics): daily sample $(date -u +%Y-%m-%d)"
          git push
