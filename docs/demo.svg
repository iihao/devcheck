<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="13">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .bar { fill: #161b22; }
      .dim { fill: #8b949e; }
      .fg { fill: #c9d1d9; }
      .green { fill: #7ee787; }
      .blue { fill: #79c0ff; }
      .orange { fill: #ffa657; }
      .title { fill: #8b949e; font-size: 12; }
    </style>
  </defs>

  <!-- frame 1: devcheck why 5000 -->
  <rect class="bg" x="0" y="0" width="940" height="322" rx="10"/>
  <rect class="border" x="0.5" y="0.5" width="939" height="321" rx="10"/>
  <path class="bar" d="M0 10a10 10 0 0 1 10-10h920a10 10 0 0 1 10 10v22H0z"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text class="title" x="470" y="21" text-anchor="middle">devcheck — zsh</text>

  <text x="24" y="60"><tspan class="green">$ </tspan><tspan class="fg">devcheck why 5000</tspan></text>
  <text class="fg" x="24" y="88">Port 5000: 1 process(es) listening</text>

  <text x="24" y="116">
    <tspan class="green">  ● </tspan><tspan class="blue">ControlCenter</tspan><tspan class="fg">  PID 804  </tspan><tspan class="dim">[app/mine]</tspan><tspan class="green">  reachable</tspan>
  </text>
  <text class="dim" x="24" y="138">      binary: /System/Library/CoreServices/ControlCenter.app/Contents/MacOS/ControlCenter</text>

  <text x="24" y="168">
    <tspan class="dim">  note: </tspan><tspan class="fg">Port 5000 is macOS AirPlay Receiver, served by ControlCenter.</tspan>
  </text>

  <text x="24" y="196">
    <tspan class="orange">  fix: </tspan><tspan class="fg">Turn it off in System Settings → General → AirDrop &amp; Handoff → AirPlay Receiver,</tspan>
  </text>
  <text class="fg" x="24" y="216">       or move your service to 5001/5173.</text>
  <text x="24" y="238">
    <tspan class="orange">  fix: </tspan><tspan class="fg">These are system/app processes — the cheapest fix is a different port (e.g. 5001).</tspan>
  </text>

  <text x="24" y="272">
    <tspan class="green">$ </tspan><tspan class="fg">devcheck ports</tspan><tspan class="dim">   # grouped by project, 25 app/system ports filtered out</tspan>
  </text>

  <!-- frame 2: port map -->
  <rect class="bg" x="0" y="336" width="940" height="224" rx="10"/>
  <rect class="border" x="0.5" y="336.5" width="939" height="223" rx="10"/>
  <path class="bar" d="M0 346a10 10 0 0 1 10-10h920a10 10 0 0 1 10 10v22H0z"/>
  <circle cx="20" cy="352" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="352" r="6" fill="#febc2e"/>
  <circle cx="60" cy="352" r="6" fill="#28c840"/>
  <text class="title" x="470" y="357" text-anchor="middle">devcheck — port map</text>

  <text class="dim" x="24" y="392">PORT  PROTO  STATE  PID    CPU   SOURCE   PROJECT            COMMAND</text>
  <text class="fg" x="24" y="414">5173  TCP    ●      46595  0.0%  </text><text class="green" x="376" y="414">project</text><text class="fg" x="440" y="414">  cloud-admin(node)  node</text>
  <text class="fg" x="24" y="436">5432  TCP    ●      1638   0.0%  </text><text class="blue" x="376" y="436">brew</text><text class="fg" x="440" y="436">     -                  postgres</text>
  <text class="fg" x="24" y="458">6379  TCP    ●      1634   0.0%  </text><text class="blue" x="376" y="458">brew</text><text class="fg" x="440" y="458">     -                  redis-server</text>
  <text class="fg" x="24" y="480">8000  TCP    ●      46594  0.0%  </text><text class="green" x="376" y="480">project</text><text class="fg" x="440" y="480">  data-api(python)   Python</text>

  <text class="dim" x="24" y="522">Menu bar: ports grouped by project · hover to open / copy / reveal / kill</text>
</svg>